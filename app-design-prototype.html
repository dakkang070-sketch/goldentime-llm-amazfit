<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starmax Health Monitor - App Design Prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .phone-frame {
            width: 375px;
            height: 812px;
            background: #000;
            border-radius: 40px;
            padding: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: #f8fafc;
            border-radius: 30px;
            overflow: hidden;
            position: relative;
        }

        .status-bar {
            height: 44px;
            background: rgba(255,255,255,0.95);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .screen-content {
            height: calc(100% - 44px);
            overflow-y: auto;
            padding-bottom: 80px;
        }

        .header {
            background: linear-gradient(135deg, #0d9488 0%, #14b8a6 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 20px;
        }

        .metric-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #e5e7eb;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .metric-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .metric-card.critical {
            border-color: #ef4444;
            background: linear-gradient(135deg, #fef2f2 0%, #ffffff 100%);
        }

        .metric-card.warning {
            border-color: #f59e0b;
            background: linear-gradient(135deg, #fff7ed 0%, #ffffff 100%);
        }

        .metric-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .metric-title {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-icon {
            font-size: 20px;
        }

        .metric-value {
            font-size: 28px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 4px;
        }

        .metric-unit {
            font-size: 12px;
            color: #9ca3af;
            font-weight: 500;
        }

        .metric-status {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 8px;
            font-size: 10px;
            font-weight: 600;
        }

        .status-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .status-normal { background: #10b981; }
        .status-warning { background: #f59e0b; }
        .status-danger { background: #ef4444; }

        .chart-container {
            background: white;
            margin: 0 20px 20px;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 600;
            color: #1f2937;
        }

        .time-selector {
            display: flex;
            gap: 4px;
        }

        .time-button {
            padding: 4px 8px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .time-button.active {
            background: #0d9488;
            color: white;
            border-color: #0d9488;
        }

        .chart {
            height: 120px;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        .chart-line {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(45deg, #0d9488, #14b8a6);
            border-radius: 0 0 8px 8px;
            opacity: 0.8;
            animation: chartAnimation 3s ease-in-out infinite;
        }

        @keyframes chartAnimation {
            0%, 100% { transform: translateY(0) scaleY(1); }
            50% { transform: translateY(-10px) scaleY(1.1); }
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 20px;
        }

        .action-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 12px 8px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-button:hover {
            background: #f8fafc;
            border-color: #0d9488;
        }

        .action-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .action-label {
            font-size: 10px;
            font-weight: 500;
            color: #6b7280;
            text-align: center;
        }

        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-radius: 0 0 30px 30px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-item.active {
            color: #0d9488;
        }

        .nav-icon {
            font-size: 20px;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 500;
        }

        .emergency-banner {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            padding: 12px 20px;
            margin: 0 20px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideInDown 0.5s ease;
        }

        @keyframes slideInDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .emergency-text {
            font-size: 14px;
            font-weight: 600;
        }

        .emergency-action {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .emergency-action:hover {
            background: rgba(255,255,255,0.3);
        }

        .device-connection {
            background: white;
            margin: 20px;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .connection-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .connection-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .connection-subtitle {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 20px;
        }

        .connect-button {
            background: linear-gradient(135deg, #0d9488 0%, #14b8a6 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .connect-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3);
        }

        .screen-indicator {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: rgba(0,0,0,0.3);
            border-radius: 2px;
        }

        .screen-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
        }

        .control-button {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .prototype-info {
            position: absolute;
            bottom: -40px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 12px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="screen-indicator"></div>
        <div class="screen-controls">
            <button class="control-button" onclick="showConnectionScreen()" title="연결 화면">🔗</button>
            <button class="control-button" onclick="showDashboard()" title="대시보드">📊</button>
            <button class="control-button" onclick="toggleEmergency()" title="응급상황">🚨</button>
        </div>
        
        <div class="phone-screen" id="appScreen">
            <!-- 실제 앱 화면이 여기에 표시됩니다 -->
        </div>
        
        <div class="prototype-info">
            Starmax Health Monitor App Design Prototype
        </div>
    </div>

    <script>
        let currentScreen = 'dashboard';
        let emergencyMode = false;
        let connectionStatus = 'connected';

        // 실시간 데이터 업데이트
        function updateRealtimeData() {
            const heartRate = 65 + Math.floor(Math.random() * 20);
            const bloodPressureSys = 110 + Math.floor(Math.random() * 20);
            const bloodPressureDia = 70 + Math.floor(Math.random() * 10);
            const oxygen = 95 + Math.floor(Math.random() * 5);
            const temperature = 36.5 + (Math.random() * 0.4 - 0.2);
            const steps = Math.floor(Math.random() * 1000) + 5000;

            // 심박수 카드 업데이트
            const heartRateCard = document.querySelector('.metric-card:nth-child(1) .metric-value');
            if (heartRateCard) {
                heartRateCard.textContent = heartRate;
                updateCardStatus(heartRateCard.closest('.metric-card'), heartRate, 'heart');
            }

            // 혈압 카드 업데이트
            const bpCard = document.querySelector('.metric-card:nth-child(2) .metric-value');
            if (bpCard) {
                bpCard.textContent = `${bloodPressureSys}/${bloodPressureDia}`;
                updateCardStatus(bpCard.closest('.metric-card'), bloodPressureSys, 'pressure');
            }

            // 산소포화도 카드 업데이트
            const oxygenCard = document.querySelector('.metric-card:nth-child(3) .metric-value');
            if (oxygenCard) {
                oxygenCard.textContent = oxygen;
                updateCardStatus(oxygenCard.closest('.metric-card'), oxygen, 'oxygen');
            }

            // 체온 카드 업데이트
            const tempCard = document.querySelector('.metric-card:nth-child(4) .metric-value');
            if (tempCard) {
                tempCard.textContent = temperature.toFixed(1);
                updateCardStatus(tempCard.closest('.metric-card'), temperature, 'temp');
            }

            // 걸음수 카드 업데이트
            const stepsCard = document.querySelector('.metric-card:nth-child(5) .metric-value');
            if (stepsCard) {
                stepsCard.textContent = steps.toLocaleString();
            }
        }

        function updateCardStatus(card, value, type) {
            card.classList.remove('critical', 'warning');
            
            switch(type) {
                case 'heart':
                    if (value > 150 || value < 50) {
                        card.classList.add('critical');
                    } else if (value > 120 || value < 60) {
                        card.classList.add('warning');
                    }
                    break;
                case 'pressure':
                    if (value > 180 || value < 90) {
                        card.classList.add('critical');
                    } else if (value > 140 || value < 100) {
                        card.classList.add('warning');
                    }
                    break;
                case 'oxygen':
                    if (value < 90) {
                        card.classList.add('critical');
                    } else if (value < 95) {
                        card.classList.add('warning');
                    }
                    break;
                case 'temp':
                    if (value > 38.5 || value < 35.5) {
                        card.classList.add('critical');
                    } else if (value > 37.8 || value < 36.0) {
                        card.classList.add('warning');
                    }
                    break;
            }
        }

        function renderDashboard() {
            return `
                <div class="status-bar">
                    <span>9:41</span>
                    <span>🔋 85%</span>
                </div>
                
                <div class="screen-content">
                    <div class="header">
                        <h1>건강 모니터링</h1>
                        <p>실시간 생체 데이터</p>
                        <div class="connection-status">
                            <div class="status-dot"></div>
                            <span>Starmax 연결됨</span>
                        </div>
                    </div>

                    ${emergencyMode ? `
                        <div class="emergency-banner">
                            <div class="emergency-text">
                                🚨 심박수 185bpm - 응급상황!
                            </div>
                            <button class="emergency-action">응급조치</button>
                        </div>
                    ` : ''}

                    <div class="metrics-grid">
                        <div class="metric-card">
                            <div class="metric-header">
                                <div class="metric-title">심박수</div>
                                <div class="metric-icon">❤️</div>
                            </div>
                            <div class="metric-value">72</div>
                            <div class="metric-unit">bpm</div>
                            <div class="metric-status">
                                <div class="status-indicator status-normal"></div>
                                <span>정상</span>
                            </div>
                        </div>

                        <div class="metric-card">
                            <div class="metric-header">
                                <div class="metric-title">혈압</div>
                                <div class="metric-icon">💉</div>
                            </div>
                            <div class="metric-value">118/78</div>
                            <div class="metric-unit">mmHg</div>
                            <div class="metric-status">
                                <div class="status-indicator status-normal"></div>
                                <span>정상</span>
                            </div>
                        </div>

                        <div class="metric-card">
                            <div class="metric-header">
                                <div class="metric-title">산소포화도</div>
                                <div class="metric-icon">🫁</div>
                            </div>
                            <div class="metric-value">98</div>
                            <div class="metric-unit">%</div>
                            <div class="metric-status">
                                <div class="status-indicator status-normal"></div>
                                <span>정상</span>
                            </div>
                        </div>

                        <div class="metric-card">
                            <div class="metric-header">
                                <div class="metric-title">체온</div>
                                <div class="metric-icon">🌡️</div>
                            </div>
                            <div class="metric-value">36.7</div>
                            <div class="metric-unit">°C</div>
                            <div class="metric-status">
                                <div class="status-indicator status-normal"></div>
                                <span>정상</span>
                            </div>
                        </div>
                    </div>

                    <div class="chart-container">
                        <div class="chart-header">
                            <div class="chart-title">심박수 추이</div>
                            <div class="time-selector">
                                <button class="time-button">1H</button>
                                <button class="time-button active">6H</button>
                                <button class="time-button">24H</button>
                            </div>
                        </div>
                        <div class="chart">
                            <div class="chart-line"></div>
                        </div>
                    </div>

                    <div class="quick-actions">
                        <div class="action-button">
                            <div class="action-icon">👨‍👩‍👧‍👦</div>
                            <div class="action-label">가족알림</div>
                        </div>
                        <div class="action-button">
                            <div class="action-icon">📊</div>
                            <div class="action-label">건강기록</div>
                        </div>
                        <div class="action-button">
                            <div class="action-icon">🏥</div>
                            <div class="action-label">병원찾기</div>
                        </div>
                        <div class="action-button">
                            <div class="action-icon">⚙️</div>
                            <div class="action-label">설정</div>
                        </div>
                    </div>
                </div>

                <div class="bottom-nav">
                    <div class="nav-item active">
                        <div class="nav-icon">🏠</div>
                        <div class="nav-label">홈</div>
                    </div>
                    <div class="nav-item">
                        <div class="nav-icon">📈</div>
                        <div class="nav-label">분석</div>
                    </div>
                    <div class="nav-item">
                        <div class="nav-icon">🎯</div>
                        <div class="nav-label">목표</div>
                    </div>
                    <div class="nav-item">
                        <div class="nav-icon">👤</div>
                        <div class="nav-label">프로필</div>
                    </div>
                </div>
            `;
        }

        function renderConnectionScreen() {
            return `
                <div class="status-bar">
                    <span>9:41</span>
                    <span>🔋 85%</span>
                </div>
                
                <div class="screen-content" style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: calc(100% - 124px);">
                    <div class="device-connection">
                        <div class="connection-icon">⌚</div>
                        <div class="connection-title">Starmax 스마트워치 연결</div>
                        <div class="connection-subtitle">근처의 스마트워치를 찾고 있습니다</div>
                        <button class="connect-button" onclick="showDashboard()">기기 찾기</button>
                    </div>
                </div>

                <div class="bottom-nav">
                    <div class="nav-item">
                        <div class="nav-icon">🏠</div>
                        <div class="nav-label">홈</div>
                    </div>
                    <div class="nav-item">
                        <div class="nav-icon">📈</div>
                        <div class="nav-label">분석</div>
                    </div>
                    <div class="nav-item">
                        <div class="nav-icon">🎯</div>
                        <div class="nav-label">목표</div>
                    </div>
                    <div class="nav-item">
                        <div class="nav-icon">👤</div>
                        <div class="nav-label">프로필</div>
                    </div>
                </div>
            `;
        }

        function showDashboard() {
            currentScreen = 'dashboard';
            document.getElementById('appScreen').innerHTML = renderDashboard();
        }

        function showConnectionScreen() {
            currentScreen = 'connection';
            document.getElementById('appScreen').innerHTML = renderConnectionScreen();
        }

        function toggleEmergency() {
            emergencyMode = !emergencyMode;
            if (currentScreen === 'dashboard') {
                showDashboard();
            }
        }

        // 초기화
        showDashboard();

        // 실시간 데이터 업데이트 시작
        setInterval(updateRealtimeData, 2000);
    </script>
</body>
</html>
