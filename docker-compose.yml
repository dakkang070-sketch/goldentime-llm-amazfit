version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: goldentime-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: goldentime
    volumes:
      - mongodb_data:/data/db
    networks:
      - goldentime-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goldentime-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/goldentime
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key}
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - mongodb
    volumes:
      - ./logs:/app/logs
    networks:
      - goldentime-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: goldentime-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_SOCKET_URL: http://localhost:3000
    depends_on:
      - backend
    networks:
      - goldentime-network

volumes:
  mongodb_data:

networks:
  goldentime-network:
    driver: bridge
