version: '3.8'

services:
  # MongoDB 데이터베이스
  mongodb:
    image: mongo:7.0
    container_name: goldentime-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: goldentime2024
      MONGO_INITDB_DATABASE: goldentime_llm
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "27017:27017"
    networks:
      - goldentime-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.admin.help()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis 캐시
  redis:
    image: redis:7.2-alpine
    container_name: goldentime-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass goldentime2024
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - goldentime-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Golden Time LLM 메인 애플리케이션
  goldentime-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goldentime-llm-app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 데이터베이스 연결
      MONGODB_URI: mongodb://admin:goldentime2024@mongodb:27017/goldentime_llm?authSource=admin
      REDIS_URL: redis://:goldentime2024@redis:6379
      
      # 서버 설정
      NODE_ENV: production
      PORT: 3000
      
      # Ollama 설정
      OLLAMA_BASE_URL: http://localhost:11434
      
      # API 키들 (실제 운영시 환경변수나 시크릿으로 설정)
      NEDC_API_SERVICE_KEY: ${NEDC_API_SERVICE_KEY:-}
      HIRA_API_SERVICE_KEY: ${HIRA_API_SERVICE_KEY:-}
      
      # 기능 활성화 플래그
      ENABLE_AUTO_LEARNING: true
      ENABLE_EMERGENCY_WORKFLOW: true
      ENABLE_QUALITY_MANAGEMENT: true
      ENABLE_REALTIME_BIOSIGNAL: true
      ENABLE_SUBSTANCE_DETECTION: true
      ENABLE_DATA_PROCESSING: false
      ENABLE_MODEL_TRAINING: false
      ENABLE_LORA_TRAINING: false
      
      # JWT 설정
      JWT_SECRET: ${JWT_SECRET:-goldentime_jwt_secret_2024}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-goldentime_refresh_secret_2024}
      
      # 로깅 설정
      LOG_LEVEL: info
      LOG_FILE_PATH: ./logs
      
      # AI 모델 설정
      AI_MODEL_PATH: ./weights
      LORA_MODEL_PATH: ./lora_models
      
      # 실시간 처리 설정
      WEBSOCKET_ENABLED: true
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      
    volumes:
      - app_logs:/home/appuser/app/logs
      - ai_models:/home/appuser/app/weights
      - lora_models:/home/appuser/app/lora_models
      - processed_data:/home/appuser/app/processed_data
    ports:
      - "3000:3000"   # 메인 API 서버
      - "11434:11434" # Ollama API
    networks:
      - goldentime-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Nginx 리버스 프록시 (프로덕션용)
  nginx:
    image: nginx:alpine
    container_name: goldentime-nginx
    restart: unless-stopped
    depends_on:
      - goldentime-app
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - goldentime-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 모니터링: Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: goldentime-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - goldentime-network
    profiles:
      - monitoring

  # 모니터링: Grafana
  grafana:
    image: grafana/grafana-oss:latest
    container_name: goldentime-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: goldentime2024
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    networks:
      - goldentime-network
    profiles:
      - monitoring

  # AI 모델 훈련 전용 서비스 (필요시 실행)
  model-trainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goldentime-model-trainer
    environment:
      MONGODB_URI: mongodb://admin:goldentime2024@mongodb:27017/goldentime_llm?authSource=admin
      ENABLE_DATA_PROCESSING: true
      ENABLE_MODEL_TRAINING: true
      ENABLE_LORA_TRAINING: true
      CUDA_VISIBLE_DEVICES: 0  # GPU 사용시
    volumes:
      - ai_models:/home/appuser/app/weights
      - lora_models:/home/appuser/app/lora_models
      - processed_data:/home/appuser/app/processed_data
      - training_logs:/home/appuser/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - goldentime-network
    profiles:
      - training
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

# 네트워크 설정
networks:
  goldentime-network:
    driver: bridge

# 볼륨 설정
volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  app_logs:
    driver: local
  ai_models:
    driver: local
  lora_models:
    driver: local
  processed_data:
    driver: local
  training_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local